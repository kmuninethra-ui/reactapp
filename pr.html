<!DOCTYPE html>
<html>
<head>
<title>Sign Up</title>
<style>
body{background:linear-gradient(135deg,#667eea,#764ba2);display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:Arial;color:white}
.box{background:rgba(255,255,255,0.15);padding:30px;border-radius:20px;width:350px}
h2{text-align:center}
input,select{width:94%;padding:10px;margin:8px 0;border:none;border-radius:8px}
button{width:100%;padding:12px;background:white;color:#667eea;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
a{color:white;text-align:center;display:block;margin-top:15px}
</style>
</head>
<body>
<div class="box">
  <h2>Sign Up - Any Name</h2>
  <input id="name" placeholder="Enter Any Name" required>
  <input id="age" type="number" placeholder="Enter Age" required>
  <select id="gender" required>
    <option value="">Select Gender</option><option>Male</option><option>Female</option><option>Other</option>
  </select>
  <input id="email" type="email" placeholder="Enter Any Email" required>
  <input id="password" type="password" placeholder="Create Password" required>
  <button onclick="signup()">Create User</button>
  <p id="count" style="text-align:center"></p>
  <a href="login.html">Go to Login Page</a>
</div>

<script>
let users = JSON.parse(localStorage.getItem('users')) || [];
function updateCount(){ document.getElementById('count').innerText = "Total Users: " + users.length + " / 10"; }
function signup(){
  if(users.length >= 10){ alert("10 Users Limit Reached! Go to Login"); return; }
  let name = document.getElementById('name').value.trim();
  let age = document.getElementById('age').value;
  let gender = document.getElementById('gender').value;
  let email = document.getElementById('email').value.trim();
  let password = document.getElementById('password').value;

  if(!name || !age || !gender || !email || !password){ alert("Please fill all fields"); return; }

  // No name restriction - any name allowed
  users.push({name, age, gender, email, password});
  localStorage.setItem('users', JSON.stringify(users));
  alert("User Created: " + name);
  document.querySelectorAll('input').forEach(i=>i.value="");
  document.getElementById('gender').value="";
  updateCount();
}
updateCount();
</script>
</body>
</html>
